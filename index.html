<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NGP Developments</title><style>body{margin:0;font-family:system-ui;background:#edf1f5;color:#172438}header{background:#172438;color:white;padding:22px}main{max-width:1000px;margin:auto;padding:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,select,input,textarea{font:inherit;padding:10px;border:1px solid #cbd5df;border-radius:9px}button{cursor:pointer;background:white}button.active,.primary{background:#172438;color:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:white;padding:18px;border-radius:14px;box-shadow:0 1px 5px #0001;margin-bottom:12px}.metric{font-size:26px;font-weight:700;margin:8px 0}small{color:#66758a}.progress{background:#e4eaf0;height:9px;border-radius:9px;overflow:hidden}.progress span{display:block;background:#318578;height:100%}label{display:block;margin:12px 0 5px}input,textarea,select{box-sizing:border-box;width:100%;background:white}textarea{min-height:70px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{background:#e9f5f1;color:#166755;padding:5px 9px;border-radius:20px;font-size:12px}.muted{color:#657286}.notice{background:#fff7d8;padding:10px;border-radius:9px;margin:12px 0}h2{margin-top:25px}ul{padding-left:20px}li{margin:8px 0}@media(max-width:550px){main{padding:12px}.row{align-items:flex-start}}</style></head><body><header><strong>NGP DEVELOPMENTS</strong><div style="opacity:.75;font-size:13px">Project management & customer portal</div></header><main><div class="notice">Demo mode — example data stored in this browser only. No real customer authentication or online syncing.</div><div class="nav"><button id="staff" class="active" onclick="switchRole('staff')">Company dashboard</button><button id="client" onclick="switchRole('client')">Customer portal</button></div><div id="app"></div></main><script>
const initial={projects:[{id:1,name:'Upper Aston Hill Extension',client:'Demo Customer A',budget:186000,spent:42500,progress:15,status:'Pre-construction',updates:['Project programme prepared','Initial site meeting completed'],tasks:['Confirm start date','Order structural steel'],payments:[{name:'Management stage',amount:4500,paid:false}]},{id:2,name:'Residential Renovation',client:'Demo Customer B',budget:95000,spent:52000,progress:55,status:'First fix',updates:['Electrical first fix underway'],tasks:['Book plasterer'],payments:[{name:'First fix stage',amount:18000,paid:true}]}],selected:1};let data=JSON.parse(localStorage.getItem('ngp_demo_v1')||'null')||initial,role='staff',tab='overview';const money=n=>'£'+Number(n||0).toLocaleString('en-GB');const save=()=>localStorage.setItem('ngp_demo_v1',JSON.stringify(data));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const p=()=>data.projects.find(x=>x.id===Number(data.selected))||data.projects[0];function switchRole(r){role=r;tab='overview';document.getElementById('staff').classList.toggle('active',r==='staff');document.getElementById('client').classList.toggle('active',r==='client');render()};function nav(t){tab=t;render()};function selectProject(id){data.selected=Number(id);save();render()};function addProject(){let name=prompt('Project name');if(!name)return;let client=prompt('Customer display name')||'Customer';let budget=Number(prompt('Agreed budget (£)')||0);let id=Date.now();data.projects.push({id,name,client,budget,spent:0,progress:0,status:'Planning',updates:[],tasks:[],payments:[]});data.selected=id;save();render()};function updateField(field,val){p()[field]=['progress','budget','spent'].includes(field)?Number(val):val;save();render()};function addItem(kind){let input=document.getElementById('new-'+kind);let val=input.value.trim();if(!val)return;p()[kind].unshift(val);save();render()};function addPayment(){let name=document.getElementById('payment-name').value.trim(),amount=Number(document.getElementById('payment-amount').value);if(!name||!(amount>0))return;p().payments.push({name,amount,paid:false});save();render()};function togglePayment(i){p().payments[i].paid=!p().payments[i].paid;save();render()};function reset(){if(confirm('Reset all demo data?')){data=structuredClone(initial);save();render()}}function projectSelector(){return `<div class="row"><h2>${role==='staff'?'Projects':'My project'}</h2>${role==='staff'?'<button onclick="addProject()">+ Add project</button>':''}</div><select onchange="selectProject(this.value)">${data.projects.map(x=>`<option value="${x.id}" ${x.id===p().id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`};function render(){let project=p(),total=data.projects.reduce((s,x)=>s+x.budget,0),spent=data.projects.reduce((s,x)=>s+x.spent,0),unpaid=data.projects.flatMap(x=>x.payments).filter(x=>!x.paid).reduce((s,x)=>s+x.amount,0);let out=role==='staff'?`<div class="cards"><div class="card"><small>Active projects</small><div class="metric">${data.projects.length}</div></div><div class="card"><small>Contract value</small><div class="metric">${money(total)}</div></div><div class="card"><small>Recorded costs</small><div class="metric">${money(spent)}</div></div><div class="card"><small>Unpaid stages</small><div class="metric">${money(unpaid)}</div></div></div>`:'';out+=projectSelector();out+=`<div class="nav">${(role==='staff'?['overview','finances','tasks','updates']:['overview','updates','payments']).map(t=>`<button class="${tab===t?'active':''}" onclick="nav('${t}')">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>`;if(tab==='overview'){out+=`<div class="card"><div class="row"><h2>${esc(project.name)}</h2><span class="tag">${esc(project.status)}</span></div><p class="muted">${esc(project.client)}</p><div class="row"><strong>Project progress</strong><strong>${project.progress}%</strong></div><div class="progress"><span style="width:${Math.max(0,Math.min(100,project.progress))}%"></span></div>${role==='staff'?`<label>Update progress (%)</label><input type="range" min="0" max="100" value="${project.progress}" onchange="updateField('progress',this.value)"><label>Current stage</label><select onchange="updateField('status',this.value)">${['Planning','Pre-construction','Groundworks','Structure','Roofing','First fix','Plastering','Second fix','Finishing','Complete'].map(s=>`<option ${project.status===s?'selected':''}>${s}</option>`).join('')}</select>`:''}</div><div class="card"><h3>Latest updates</h3>${project.updates.length?`<ul>${project.updates.slice(0,5).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'No updates yet'}</div>`}if(tab==='finances'&&role==='staff'){out+=`<div class="cards"><div class="card"><small>Contract value</small><div class="metric">${money(project.budget)}</div></div><div class="card"><small>Costs to date</small><div class="metric">${money(project.spent)}</div></div><div class="card"><small>Budget less costs (not profit)</small><div class="metric">${money(project.budget-project.spent)}</div></div></div><div class="card"><label>Contract value (£)</label><input type="number" value="${project.budget}" onchange="updateField('budget',this.value)"><label>Costs to date (£)</label><input type="number" value="${project.spent}" onchange="updateField('spent',this.value)"></div><div class="card"><h3>Stage payments</h3>${paymentList()}<label>Stage description</label><input id="payment-name" placeholder="e.g. Foundations"><label>Amount (£)</label><input id="payment-amount" type="number" min="1"><p><button class="primary" onclick="addPayment()">Add payment stage</button></p></div>`}if(tab==='payments'){out+=`<div class="card"><h3>Payment schedule</h3>${paymentList()}</div>`}if(tab==='tasks'){out+=`<div class="card"><h3>Site tasks</h3><ul>${project.tasks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><input id="new-tasks" placeholder="New task"><p><button class="primary" onclick="addItem('tasks')">Add task</button></p></div>`}if(tab==='updates'){out+=`<div class="card"><h3>Progress updates</h3><ul>${project.updates.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${role==='staff'?`<textarea id="new-updates" placeholder="Write an update for the customer"></textarea><p><button class="primary" onclick="addItem('updates')">Publish update</button></p>`:''}</div>`}if(role==='staff')out+='<p><button onclick="reset()">Reset demo data</button></p>';document.getElementById('app').innerHTML=out}function paymentList(){return p().payments.length?`<ul>${p().payments.map((x,i)=>`<li><div class="row"><span>${esc(x.name)} — <strong>${money(x.amount)}</strong></span>${role==='staff'?`<button onclick="togglePayment(${i})">${x.paid?'Paid ✓':'Mark paid'}</button>`:`<span class="tag">${x.paid?'Paid':'Awaiting payment'}</span>`}</div></li>`).join('')}</ul>`:'No payment stages recorded'}render();</script></body></html>
